name: Test missing repository input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with empty repository (expect failure)
        id: action
        uses: .
        with:
          repository: ''
          user: 'test-user'
          git-token: 'fake-token-xyz'
          release-type: 'release'
          release-token: 'fake-token-xyz'
        continue-on-error: true
      - name: Assert action failed due to missing repository
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Accept 'failure' or 'error' - Docker build failures may report as 'error'
          # The action should fail at validation (empty repository) or at clone
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: expected action to fail when repository is empty, but got: $OUTCOME"
            exit 1
          fi
          if [ -z "$OUTCOME" ]; then
            echo "FAIL: outcome is empty - step may not have run"
            exit 1
          fi
          echo "PASS: action correctly failed (outcome: $OUTCOME)"
