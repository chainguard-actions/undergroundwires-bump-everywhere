name: Test prerelease release-type input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with prerelease release-type (expect failure at clone)
        id: action
        uses: .
        with:
          repository: undergroundwires/bump-everywhere
          user: test-user
          git-token: fake-token-for-testing
          release-type: prerelease
          release-token: fake-release-token
        continue-on-error: true
      - name: Assert action failed at clone step (not at validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the git token is invalid (clone fails)
          # but it should NOT fail at parameter validation (all params are provided)
          # prerelease is a valid release-type value
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to invalid git token, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly accepted prerelease release-type and failed at clone (expected with invalid credentials)"
