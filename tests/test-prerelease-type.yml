name: Test pre-release type input
on:
  workflow_dispatch:
jobs:
  test-prerelease-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with pre-release type (will fail at clone, not at validation)
        id: action
        uses: .
        continue-on-error: true
        with:
          repository: 'test-owner/test-repo'
          user: 'test-user'
          git-token: 'fake-token'
          release-type: 'pre-release'
          release-token: 'fake-token'
          commit-message: '⬆️ bump everywhere to {{version}}'
      - name: Assert action failed at clone step (not at validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because it can't clone with a fake token,
          # but it should NOT fail due to missing/empty parameter validation.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (cannot clone with fake token), but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action ran with pre-release type and failed at expected step (clone)"
