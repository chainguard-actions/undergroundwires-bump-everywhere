name: Test clone failure for invalid repository
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with non-existent repository and expect failure
        id: action
        uses: .
        with:
          repository: 'this-org-does-not-exist-xyz123/this-repo-does-not-exist-xyz123'
          user: 'test-user'
          git-token: 'invalid-token-that-will-fail'
          release-type: 'release'
          release-token: 'invalid-token-that-will-fail'
          commit-message: '⬆️ bump everywhere to {{version}}'
        continue-on-error: true
      - name: Assert action failed due to clone failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when cloning non-existent repository, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when repository does not exist"
