name: Test missing release-type parameter validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with empty release-type and expect failure
        id: action
        uses: .
        with:
          repository: 'some-org/some-repo'
          user: 'test-user'
          git-token: 'fake-token'
          release-type: ''
          release-token: 'fake-token'
          commit-message: '⬆️ bump everywhere to {{version}}'
        continue-on-error: true
      - name: Assert action failed due to missing release-type
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when release-type is empty, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when release-type is empty"
