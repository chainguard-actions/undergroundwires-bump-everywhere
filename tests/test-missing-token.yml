name: Test missing git token validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          repository: undergroundwires/bump-everywhere
          user: test-bot
          git-token: ""
          release-token: ""
          release-type: release
          commit-message: "bump to {{version}}"
      - name: Assert action failed due to missing token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when git-token is empty, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when git-token is empty"
